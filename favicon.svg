<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neon" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.45" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
  <!-- Neon border ring -->
  <rect x="3.25" y="3.25" width="57.5" height="57.5" rx="14.5" fill="none" stroke="url(#neon)" stroke-width="1.5" opacity="0.85"/>

  <!-- Circuit accent lines -->
  <g stroke="url(#neon)" stroke-width="1.4" opacity="0.45" fill="none" stroke-linecap="round">
    <path d="M8 50 H16 L20 46"/>
    <path d="M56 16 H48 L44 20"/>
  </g>
  <circle cx="8" cy="50" r="1.6" fill="url(#neon)" opacity="0.7"/>
  <circle cx="56" cy="16" r="1.6" fill="url(#neon)" opacity="0.7"/>

  <!-- Glowing XP monogram -->
  <text x="32" y="43" text-anchor="middle"
        font-family="'Outfit','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="29" font-weight="800" letter-spacing="-2"
        fill="url(#neon)" filter="url(#glow)">XP</text>

  <!-- Spark accent over the P -->
  <circle cx="47.5" cy="17" r="2.6" fill="url(#spark)" filter="url(#glow)"/>
</svg>
